services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    ports:
      - "5432:5432"
    volumes:
      - kira-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kira:kira@db:5432/kira
      JWT_SECRET: ${JWT_SECRET:-development-only-replace-with-a-secure-jwt-secret}
      DEMO_TODAY: "2026-09-03"
      SEED_DEMO: "1"
    ports:
      - "${KIRA_PORT:-8001}:8000"

volumes:
  kira-db:
