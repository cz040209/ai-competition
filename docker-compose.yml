services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    ports:
      - "5432:5432"
    volumes:
      - kira-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kira-db:
